name: hunt
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      cases:
        description: proptest cases per property
        default: "20000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo test --profile hunt --workspace --test robust
        env:
          PROPTEST_CASES: ${{ inputs.cases || '20000' }}
      - run: cargo test --profile hunt -p worklens-tui --test frame_budget -- --ignored --nocapture
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proptest-regressions
          path: crates/*/tests/*.regressions
          if-no-files-found: ignore

  mutants:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 0'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-mutants
      - run: cargo mutants --shard ${{ matrix.shard }}/8 --baseline=skip -j 2
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
