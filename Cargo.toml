[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
publish = false
description = "Your Bugzilla, Jira and Phabricator work in one terminal view, organized by whose turn it is"
repository = "https://github.com/tshasan/worklens"
homepage = "https://github.com/tshasan/worklens"
readme = "README.md"
keywords = ["bugzilla", "jira", "phabricator", "tui", "mozilla"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
worklens-core = { path = "crates/core", version = "0.1.1" }
worklens-sources = { path = "crates/sources", version = "0.1.1" }
worklens-store = { path = "crates/store", version = "0.1.1" }
worklens-tui = { path = "crates/tui", version = "0.1.1" }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls", "gzip", "http2"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "process", "io-util"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
indexmap = { version = "2.14.2", features = ["serde"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.39", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
large_enum_variant = "warn"
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "warn"
needless_collect = "deny"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.hunt]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
incremental = true

[profile.mutants]
inherits = "test"
debug = "none"
